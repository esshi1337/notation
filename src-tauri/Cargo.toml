[package]
name = "notation"
version = "0.1.0"
description = "A local Markdown and Mermaid editor"
edition = "2021"
rust-version = "1.89"

[lib]
name = "notation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notation"
path = "src/main.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
rquickjs = "0.14"
libc = "0.2"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "hooks"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
percent-encoding = "2"
base64 = "0.22"
roxmltree = "0.21"
url = "2"
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }
tempfile = "3"
# SQL blocks (src/sql): pure-Rust drivers over rustls with the ring provider,
# so no OpenSSL or native-tls is linked on any platform. Versions are pinned.
# SQLite uses rusqlite above; a second SQLite binding would clash on
# `links = "sqlite3"`. Passwords live in the OS keychain through `keyring`
# (Secret Service over zbus on Linux, Keychain Services on macOS).
keyring = "=4.2.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.12"
zeroize = "1"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Only to answer `applicationShouldTerminate:` (see `quit_guard` in lib.rs);
# the same version the window library already brings in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Thin LTO, one codegen unit and stripped symbols make the release binary about
# a third smaller with no measurable runtime change. `panic` stays "unwind":
# blocking-task and worker panics are turned into error messages, not aborts.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
