# Notation project-level Codex configuration.
# Launch with scripts/notation-advisor for the project filesystem boundary.
# Model selection belongs to the launcher, not this config: project model
# keys would also override unrelated named profiles in Codex 0.164.

# Resolved relative to this .codex/config.toml file.
experimental_compact_prompt_file = "../orchestration/compact.md"

# One advisor session; workers use OpenCodex via scripts/notation-worker.
[agents]
enabled = false

[features]
multi_agent = false
multi_agent_v2 = false
async_compaction = false

[mcp_servers.serena]
command = "uvx"
args = ["-p", "3.13", "--from", "serena-agent==1.7.0", "serena", "start-mcp-server", "--context", "codex", "--project-from-cwd", "--open-web-dashboard", "False"]
startup_timeout_sec = 60
